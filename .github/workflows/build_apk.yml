name: Build apk

on:
  workflow_dispatch:
  # push:
  #   branches:
  #     - main
jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup setting Files
        uses: ./.github/actions/setup_setting
        with:
          google_services_json: ${{ secrets.GOOGLE_SERVICES_JSON }}
          firebase_json: ${{ secrets.FIREBASE_JSON }}

      - name: Get latest tag and determine version
        id: version
        shell: bash
        run: |
          REF_TYPE="${{ github.ref_type }}"
          REF_NAME="${{ github.ref_name }}"

          if [ "$REF_TYPE" = "tag" ]; then
            echo "Workflow executed on tag ref: $REF_NAME"
            NEW_TAG="$REF_NAME"
            HAS_CHANGES=false
          else
            # 最新のタグを取得(vで始まるタグのみ)
            LATEST_TAG=$(git tag -l "v*" --sort=-version:refname | head -n 1)

            if [ -z "$LATEST_TAG" ]; then
              # タグが存在しない場合は v1.0.0 から開始
              NEW_TAG="v1.0.0"
              HAS_CHANGES=true
              echo "No existing tags found, starting with $NEW_TAG"
            else
              echo "Latest tag: $LATEST_TAG"
              
              # タグのコミットと現在のコミットを比較
              TAG_COMMIT=$(git rev-list -n 1 "$LATEST_TAG")
              CURRENT_COMMIT=$(git rev-parse HEAD)
              
              if [ "$TAG_COMMIT" = "$CURRENT_COMMIT" ]; then
                # 変更がない場合は既存のタグを使用
                NEW_TAG="$LATEST_TAG"
                HAS_CHANGES=false
                echo "No changes since $LATEST_TAG, using existing tag"
              else
                # 変更がある場合は一番下の位を1つ繰り上げ
                # v1.0.0 -> v1.0.1, v1.2.3 -> v1.2.4
                VERSION=$(echo "$LATEST_TAG" | sed 's/^v//')
                IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION"
                PATCH=$((PATCH + 1))
                NEW_TAG="v${MAJOR}.${MINOR}.${PATCH}"
                HAS_CHANGES=true
                echo "Changes detected, creating new tag: $NEW_TAG"
              fi
            fi
          fi

          echo "tag=$NEW_TAG" >> $GITHUB_OUTPUT
          echo "has_changes=$HAS_CHANGES" >> $GITHUB_OUTPUT
          echo "Using tag: $NEW_TAG"

      - name: Create tag if needed
        if: steps.version.outputs.has_changes == 'true'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create local.properties
        run: |
          echo "WEB_CLIENT_ID=${{ secrets.WEB_CLIENT_ID }}" >> ./local.properties
          echo "REDIRECT_URI=${{ secrets.REDIRECT_URI }}" >> ./local.properties
          echo "USE_FIREBASE_EMULATOR=false" >> ./local.properties

      - name: Build With Gradle
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      # r0adkll/sign-android-release は非推奨の set-output を使っているため、
      # SDK の zipalign / apksigner で直接署名する
      - name: Sign APK
        shell: bash
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          BUILD_TOOL_VERSION=$(ls "$ANDROID_HOME/build-tools/" | sort -V | tail -n 1)
          BUILD_TOOLS_DIR="$ANDROID_HOME/build-tools/$BUILD_TOOL_VERSION"
          echo "Using build tools: $BUILD_TOOL_VERSION"

          # keyPassword が未設定なら keystore のパスワードを使う(旧 action と同じ挙動)
          export KEY_PASSWORD="${KEY_PASSWORD:-$KEYSTORE_PASSWORD}"

          KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          echo "$SIGNING_KEY" | base64 --decode > "$KEYSTORE_FILE"

          RELEASE_DIR="app/build/outputs/apk/release"
          ALIGNED_APK="$RUNNER_TEMP/app-release-aligned.apk"
          SIGNED_APK="$RELEASE_DIR/app-release-household-expenses-${{ steps.version.outputs.tag }}.apk"

          "$BUILD_TOOLS_DIR/zipalign" -p -f 4 "$RELEASE_DIR/app-release-unsigned.apk" "$ALIGNED_APK"
          "$BUILD_TOOLS_DIR/apksigner" sign \
            --ks "$KEYSTORE_FILE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass env:KEYSTORE_PASSWORD \
            --key-pass env:KEY_PASSWORD \
            --out "$SIGNED_APK" \
            "$ALIGNED_APK"
          "$BUILD_TOOLS_DIR/apksigner" verify "$SIGNED_APK"

          rm -f "$KEYSTORE_FILE"
          echo "APK_FILE=$SIGNED_APK" >> $GITHUB_ENV

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: ${{ env.APK_FILE }}
          retention-days: 1
